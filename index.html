<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uma perguntinha ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffe1eb,#ffd0e2,#f8bcd3);font-family:Arial,sans-serif;overflow:hidden;color:#9c2859}.card{width:min(90vw,480px);padding:42px 25px;text-align:center;background:#ffffffd9;border-radius:25px;box-shadow:0 15px 50px #c84b7930}.heart{font-size:52px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.2)}}h1{font-size:clamp(25px,5vw,34px);line-height:1.25;margin:22px 0 30px}.buttons{display:flex;justify-content:center;gap:20px;min-height:56px;align-items:center}button{border:0;border-radius:14px;padding:15px 30px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 15px #0002;touch-action:manipulation}#yes{background:#31b977;color:white}#no{background:#ff5b87;color:white;position:relative;z-index:10;transition:left .15s ease,top .15s ease}#message{display:none;font-size:23px;line-height:1.4;font-weight:bold;margin-top:20px}.small{font-size:13px;opacity:.7;margin-top:25px}
</style>
</head>
<body>
<main class="card"><div class="heart">💗</div><div id="previous" style="display:none;font-size:17px;line-height:1.5;margin-top:15px;color:#a23c67">Você ainda sente saudades de mim? ❤️<br><strong>Eu sabia! 🥹❤️ Também estava com saudades de você! 💕</strong></div><h1 id="question">Você ainda sente saudades de mim?</h1><div class="buttons" id="buttons"><button id="yes">SIM 💚</button><button id="no">NÃO 💔</button></div><div id="message">Eu sabia! 🥹❤️<br>Também estava com saudades de você! 💕</div><p class="small" id="hint">Escolha com carinho 💌</p></main>
<script>
const no=document.getElementById('no'),yes=document.getElementById('yes');let escaped=false,step=0;
function flee(){if(!escaped){const r=no.getBoundingClientRect();no.style.position='fixed';no.style.left=r.left+'px';no.style.top=r.top+'px';escaped=true;}const margin=12,w=no.offsetWidth,h=no.offsetHeight;const x=margin+Math.random()*Math.max(0,innerWidth-w-2*margin),y=margin+Math.random()*Math.max(0,innerHeight-h-2*margin);no.style.left=x+'px';no.style.top=y+'px';}
no.addEventListener('mouseenter',flee);no.addEventListener('pointerdown',e=>{e.preventDefault();flee()});no.addEventListener('click',e=>{e.preventDefault();flee()});no.addEventListener('touchstart',e=>{e.preventDefault();flee()},{passive:false});
function resetNo(){no.style.position='relative';no.style.left='';no.style.top='';escaped=false;}
function finish(message){document.getElementById('question').textContent='❤️';document.getElementById('buttons').style.display='none';document.getElementById('message').innerHTML=message;document.getElementById('message').style.display='block';document.getElementById('hint').textContent='💕💕💕';}
function nextStep(){
 if(step===0){
  step=1;
  document.getElementById('previous').style.display='block';
  document.getElementById('question').textContent='Você ainda me ama? ❤️';
  document.getElementById('hint').textContent='Responde com o coração 💌';
  resetNo();
 }else if(step===1){
  step=2;
  document.getElementById('previous').innerHTML='Você ainda sente saudades de mim? ❤️<br><strong>Eu sabia! 🥹❤️ Também estava com saudades de você! 💕</strong><br><br>Você ainda me ama? ❤️<br><strong>Você deixou meu coração feliz! 🥹❤️ Eu também te amo! 💕</strong>';
  document.getElementById('question').textContent='Você quer voltar comigo? ❤️';
  document.getElementById('hint').textContent='Escolhe com carinho 💌';
  no.textContent='Um dia, se Deus quiser 🙏❤️';
  no.style.fontSize='15px';no.style.padding='15px 16px';
  resetNo();
 }else{
  finish('Então vamos tentar de novo? 🥹❤️<br>Meu coração está muito feliz! 💕');
 }
}
yes.addEventListener('click',nextStep);

</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uma pergunta pra você ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#ffe3ed,#ffc1d5);font-family:Arial,sans-serif;color:#9d2455;overflow:hidden}.card{width:min(92vw,480px);padding:35px 22px;background:#ffffffd9;border-radius:24px;box-shadow:0 15px 50px #b72c5a30;text-align:center}h1{font-size:clamp(24px,6vw,32px);line-height:1.3}p{line-height:1.5}.buttons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}button{border:0;border-radius:14px;padding:15px 22px;font-weight:700;font-size:16px;cursor:pointer;touch-action:manipulation}button.yes,.choice{background:#2fba7d;color:white}button.no{background:#ff5e8b;color:white}#no.flee{position:fixed;z-index:10;transition:left .17s ease,top .17s ease}.choice{width:100%;max-width:370px}#message{font-weight:600}#send{display:block;margin:18px auto 0;background:#168b56;color:white;width:100%;max-width:370px}#send.hidden{display:none} .heart{font-size:46px} .hidden{display:none}
</style>
</head>
<body>
<main class="card"><div class="heart">💗</div><h1 id="question">Você realmente quer tentar de novo comigo? 🥹❤️</h1><p id="message">Responde com o coração... 💕</p><div id="first" class="buttons"><button class="yes" id="yes">SIM 💚</button><button class="no" id="no">NÃO 💔</button></div><div id="dates" class="buttons hidden"><button class="choice" data-answer="HOJE À NOITE 🌙❤️">HOJE À NOITE 🌙❤️</button><button class="choice" data-answer="Um dia que eu estiver a fim 💕">Um dia que eu estiver a fim 💕</button><button class="choice" data-answer="No final de semana, quando você estiver sozinho em casa 🏡❤️">No final de semana, você vai estar sozinho em casa 🏡❤️</button></div><button id="send" class="hidden">📲 Enviar minha resposta pelo WhatsApp ❤️</button><p id="notice" class="hidden">O WhatsApp vai abrir com a mensagem pronta. Você decide se quer enviar. 💕</p></main>
<script>
const q=document.getElementById('question'),m=document.getElementById('message'),first=document.getElementById('first'),dates=document.getElementById('dates'),no=document.getElementById('no'),send=document.getElementById('send'),notice=document.getElementById('notice');
document.getElementById('yes').onclick=()=>{no.classList.add('hidden');first.classList.add('hidden');q.textContent='Que dia a gente pode se ver? 🥹❤️';m.textContent='Fiquei muito feliz com seu SIM! 💕 Escolhe o dia que for melhor pra você, sem pressão.';dates.classList.remove('hidden')};
function flee(){if(first.classList.contains('hidden'))return;no.classList.add('flee');const pad=12,w=no.offsetWidth,h=no.offsetHeight;const x=pad+Math.random()*Math.max(0,innerWidth-w-2*pad),y=pad+Math.random()*Math.max(0,innerHeight-h-2*pad);no.style.left=x+'px';no.style.top=y+'px'}
no.addEventListener('mouseenter',flee);no.addEventListener('touchstart',e=>{e.preventDefault();flee()},{passive:false});no.addEventListener('click',e=>{e.preventDefault();flee()});
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{dates.classList.add('hidden');q.textContent='Combinado! 🥰❤️';m.textContent='Sua escolha: '+b.dataset.answer+'. ❤️ Agora é só a gente conversar e combinar direitinho!';const resposta=b.dataset.answer;send.classList.remove('hidden');notice.classList.remove('hidden');send.onclick=()=>{const emojiCoracao='\u2764\uFE0F', emojiCarinha='\uD83E\uDD79', emojiLua='\uD83C\uDF19', emojiCasa='\uD83C\uDFE1', emojiBrilho='\uD83D\uDC95';const respostaLimpa=resposta.replace(/🌙❤️/g,emojiLua+emojiCoracao).replace(/🏡❤️/g,emojiCasa+emojiCoracao).replace(/💕/g,emojiBrilho);const mensagem=emojiCoracao+' Quero tentar de novo com você! '+emojiCarinha+'\n\nPara a gente se ver, escolhi: '+respostaLimpa+'\n\n'+emojiBrilho;window.open('https://wa.me/5571991349915?text='+encodeURIComponent(mensagem),'_blank','noopener,noreferrer')}});
</script>
</body></html>
